<style>
:root{--pap:#f1f0eb;--ink:#0c0c0d;--mut:#0c0c0d80;--line:#0c0c0d1a;--b:#1F3BFF;--g:clamp(16px,2.6vw,40px);--gap:clamp(8px,1vw,14px);--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
body{background:var(--pap);color:var(--ink);font:400 15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}img,svg{display:block}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--b);color:#fff}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.mut{color:var(--mut)}

/* progress */
.pr{position:fixed;inset:0 0 auto;height:2px;background:var(--b);transform-origin:0 50%;transform:scaleX(0);z-index:90}

/* top bar */
.top{position:fixed;z-index:80;left:0;right:0;top:0;padding:calc(var(--g)*.6 + env(safe-area-inset-top,0px)) var(--g) 14px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(var(--pap) 55%,#f1f0eb00);transition:transform .7s var(--e)}
.top.hide{transform:translateY(-110%)}
.lg{display:flex;align-items:center;gap:12px}
.lg .sym{width:30px;height:30px;transition:transform .9s var(--e)}
.lg:hover .sym{transform:rotate(-90deg)}
.lg .wm{height:11px;width:auto}
@media(max-width:560px){.lg .wm{display:none}}

/* hero */
.hero{padding:calc(110px + 6vh) var(--g) clamp(28px,4vw,56px)}
.hero h1{font-weight:800;font-stretch:76%;text-transform:uppercase;line-height:.88;letter-spacing:.004em;font-size:clamp(52px,11.5vw,190px)}
.hero h1 .r{display:block;overflow:hidden;padding-bottom:.02em}
.hero h1 .r>span{display:block;transform:translateY(102%);transition:transform 1.3s var(--e)}
.hero h1 .r:nth-child(2)>span{transition-delay:.09s;color:var(--b)}
.in .hero h1 .r>span{transform:none}
.meta{margin-top:clamp(24px,3vw,40px);padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;
  opacity:0;transition:opacity 1s .45s}
.in .meta{opacity:1}

/* gallery */
.gal{padding:0 var(--g)}
.row{display:flex;gap:var(--gap);margin:0 auto var(--gap);justify-content:center}
.row.sp{margin-top:clamp(36px,6vw,96px)}
.fig{position:relative;flex:var(--ar) 1 0%;min-width:0}
.fr{position:relative;aspect-ratio:var(--ar);overflow:hidden;background:var(--c);border-radius:4px;cursor:zoom-in;
  opacity:0;transform:translateY(28px);transition:opacity 1s var(--e),transform 1.2s var(--e)}
.fig.on .fr{opacity:1;transform:none}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .9s var(--e),transform 1.6s var(--e)}
.fr img.ld{opacity:1;transform:none}
@media(hover:hover){.fr:hover img.ld{transform:scale(1.025);transition:transform 1.2s var(--e)}}
.cap{display:flex;gap:10px;align-items:baseline;padding-top:10px;min-height:28px;opacity:0;transition:opacity .8s .2s}
.fig.on .cap{opacity:1}
.cap b{font-weight:600}
.cap span{color:var(--mut)}
@media(max-width:720px){.cap{flex-direction:column;gap:0;min-height:0;padding-bottom:6px}}

/* footer */
.ft{margin-top:clamp(70px,10vw,150px);padding:clamp(40px,6vw,80px) var(--g) calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
.ft .sym{width:46px;height:46px;margin-bottom:22px}
.ft .mail{font-weight:800;font-stretch:76%;text-transform:uppercase;line-height:.95;font-size:clamp(22px,5vw,72px);transition:color .3s;overflow-wrap:anywhere}
.ft .mail:hover{color:var(--b)}
.ft .r{text-align:right;display:grid;gap:6px}
.ft .r a:hover{color:var(--b)}
@media(max-width:720px){.ft{grid-template-columns:1fr}.ft .r{text-align:left}.ft .mail{font-size:5.6vw;white-space:nowrap}}

/* viewer */
.lb{position:fixed;inset:0;z-index:100;background:var(--pap);display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;transition:opacity .45s var(--e),visibility 0s .45s}
.lb.open{opacity:1;visibility:visible;transition:opacity .45s var(--e)}
.lb-t,.lb-b{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--g) 14px}
.lb-b{padding:14px var(--g) calc(16px + env(safe-area-inset-bottom,0px))}
.lb-st{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 var(--g);touch-action:pan-y}
.lb-st img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;transition:opacity .35s,transform .5s var(--e)}
.lb-st img.out{opacity:0;transform:scale(.985)}
.lb-cap b{font-weight:600}
.btn{border:1px solid var(--line);border-radius:99px;padding:9px 16px;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--ink);color:var(--pap);border-color:var(--ink)}
.nav{display:flex;gap:8px}
.cnt{font-variant-numeric:tabular-nums}
.zl,.zr{position:absolute;top:0;bottom:0;width:30%;cursor:w-resize}.zr{right:0;cursor:e-resize}.zl{left:0}
@media(hover:none){.zl,.zr{display:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>

    <button class="zl" id="zl" aria-label="Previous"></button>
    <button class="zr" id="zr" aria-label="Next"></button>
  </div>
  <div class="lb-b">
    <span class="cnt lbl mut" id="lbN"></span>
    <div class="nav"><button class="btn lbl" id="lbP">← Prev</button><button class="btn lbl" id="lbF">Next →</button></div>
  </div>
</div>

<script>
/* Image sizes and colours (generated) */
const META = {"niyom": {"ar": 1.5, "c": "#c2bba6"}, "rage-raga": {"ar": 1.4938, "c": "#524164"}, "boond": {"ar": 1.5, "c": "#83b7d0"}, "iveda-rusk": {"ar": 1.4241, "c": "#7e5323"}, "iveda-moringa": {"ar": 0.6422, "c": "#b1c5bb"}, "iveda-clove": {"ar": 0.6422, "c": "#c8b2a7"}, "iveda-wheat": {"ar": 0.6422, "c": "#dacbad"}, "iveda-chilli": {"ar": 0.6422, "c": "#ccaeaa"}, "iveda-sabudana": {"ar": 0.6422, "c": "#ccb4af"}, "iveda-toordal": {"ar": 0.6422, "c": "#deb8a8"}, "iveda-sonamasoori": {"ar": 0.6422, "c": "#b7acbf"}, "retro-grid": {"ar": 1.0, "c": "#97675d"}, "retro-milk": {"ar": 1.0, "c": "#5f6467"}, "retro-open": {"ar": 1.0, "c": "#976040"}, "makhayam-spicy": {"ar": 0.8539, "c": "#dbaa9c"}, "makhayam-onion": {"ar": 0.8539, "c": "#acc3ba"}, "makhayam-salt": {"ar": 0.8539, "c": "#d8b0b9"}, "durex-rabbit": {"ar": 1.467, "c": "#712f5c"}, "durex-wand": {"ar": 1.3343, "c": "#315059"}, "durex-dreamy": {"ar": 1.5, "c": "#851960"}, "durex-impulsive": {"ar": 1.3333, "c": "#9a6a3a"}, "ikonic-me": {"ar": 1.2561, "c": "#7c9b90"}, "ikonic-gleam": {"ar": 1.5639, "c": "#4e5953"}, "ikonic-gleam-back": {"ar": 1.5639, "c": "#6c7370"}, "companio-range": {"ar": 1.2448, "c": "#dfe1e0"}, "companio-ems": {"ar": 0.8883, "c": "#e4e4e4"}, "companio-tens": {"ar": 0.8852, "c": "#e1e6e6"}, "companio-knee": {"ar": 1.6569, "c": "#e1dad6"}, "companio-tummy": {"ar": 1.8846, "c": "#d6d5db"}, "companio-back": {"ar": 1.9234, "c": "#dee0da"}, "cookie-fruit": {"ar": 1.0, "c": "#922f50"}, "cookie-choco": {"ar": 1.0, "c": "#a66b2e"}, "cookie-oat": {"ar": 1.0, "c": "#354870"}, "snacfix-chilli": {"ar": 0.6772, "c": "#d9cbbe"}, "snacfix-salt": {"ar": 0.6772, "c": "#dacdd4"}, "snacfix-mexican": {"ar": 0.6772, "c": "#d8c4bf"}, "jolliz-front": {"ar": 0.8718, "c": "#d4c5b1"}, "jolliz-back": {"ar": 1.1029, "c": "#e5e0da"}, "moolam": {"ar": 1.283, "c": "#e4deca"}, "four-square": {"ar": 1.791, "c": "#6d4931"}};

/* Brands */
const B = {
  iveda:["Iveda Signature","Staples & Bakery"], companio:["Companio","Wellness Devices"], makhayam:["Makhayam","Snacks"],
  snacfix:["Snacfix","Snacks"], niyom:["Niyom","Personal Care"], rage:["Rage & Raga","Hair Care"], boond:["Boond","Plant Care"],
  retro:["Retro Fusion","Chocolate"], cookie:["Cookie Craze","Cookies"], durex:["Durex Play","Sexual Wellness"],
  durexpt:["Durex Playthings","Sexual Wellness"], ikonic:["Ikonic","Hair Styling Appliances"], jolliz:["Anand Jolliz","Namkeen"],
  moolam:["Moolam Tatva","Maternal Care"], four:["Four Square","Tobacco"]
};

/* Curated order. Each inner list is one row on desktop; "sp" adds breathing room before the row. */
const ROWS = [
  {sp:0, items:[["niyom","niyom"]]},
  {sp:0, items:[["rage-raga","rage"],["boond","boond"]]},
  {sp:1, items:[["iveda-rusk","iveda"],["iveda-moringa","iveda"],["iveda-clove","iveda"]]},
  {sp:0, items:[["iveda-wheat","iveda"],["iveda-chilli","iveda"],["iveda-sabudana","iveda"],["iveda-toordal","iveda"],["iveda-sonamasoori","iveda"]]},
  {sp:1, items:[["retro-grid","retro"],["retro-milk","retro"],["retro-open","retro"]]},
  {sp:1, items:[["makhayam-spicy","makhayam"],["makhayam-onion","makhayam"],["makhayam-salt","makhayam"]]},
  {sp:0, items:[["snacfix-chilli","snacfix"],["snacfix-salt","snacfix"],["snacfix-mexican","snacfix"]]},
  {sp:1, items:[["durex-rabbit","durex"],["durex-wand","durex"]]},
  {sp:0, items:[["durex-dreamy","durexpt"],["durex-impulsive","durexpt"]]},
  {sp:1, items:[["ikonic-me","ikonic"],["ikonic-gleam","ikonic"],["ikonic-gleam-back","ikonic"]]},
  {sp:1, items:[["companio-range","companio"],["companio-ems","companio"],["companio-tens","companio"]]},
  {sp:0, items:[["companio-knee","companio"],["companio-tummy","companio"],["companio-back","companio"]]},
  {sp:1, items:[["cookie-fruit","cookie"],["cookie-choco","cookie"],["cookie-oat","cookie"]]},
  {sp:1, items:[["jolliz-front","jolliz"],["jolliz-back","jolliz"],["moolam","moolam"]]},
  {sp:1, items:[["four-square","four"]]},
];

const onSite = /sharpstory\.studio$|netlify\.app$/.test(location.hostname);
const IMG = onSite ? "/selected/packaging/img/" : "img/";
const gal = document.getElementById("gal");
const ALL = [];
ROWS.forEach(r => r.items.forEach(([id, br]) => ALL.push({ id, br, ar: META[id].ar, c: META[id].c })));
document.getElementById("count").textContent = `${Object.keys(B).length - 1} brands · ${ALL.length} visuals`;
document.getElementById("yr").textContent = new Date().getFullYear();

/* ---------- layout: justified rows, never cropped ---------- */
/* phones: split a curated row into the most even set of rows (no lonely giants, no slivers) */
function balance(items, W) {
  const T = W * 0.56, n = items.length; let best = null, bestC = 1e9;
  for (let mask = 0; mask < (1 << (n - 1)); mask++) {
    const parts = []; let cur = [items[0]];
    for (let i = 1; i < n; i++) { if (mask & (1 << (i - 1))) { parts.push(cur); cur = []; } cur.push(items[i]); }
    parts.push(cur);
    let c = 0;
    parts.forEach(p => {
      const s = p.reduce((a, x) => a + x.ar, 0), h = W / s;
      c += Math.log(h / T) ** 2;
      if (p.some(x => (W * x.ar / s) < W * 0.27)) c += 5;   // never let a tile get too narrow
    });
    c += parts.length * 0.04;
    if (c < bestC) { bestC = c; best = parts; }
  }
  return best;
}

let mode = "";
function layout() {
  const W = gal.clientWidth, mob = innerWidth <= 720;
  const m = mob ? "m" : "d";
  if (m === mode && gal.childElementCount) { sizeRows(); return; }
  mode = m; gal.innerHTML = "";
  let idx = 0, prevBrand = null;
  ROWS.forEach(r => {
    let groups = [r.items.map(it => ALL[idx++])];
    if (mob) groups = balance(groups[0], W);
    groups.forEach((g, gi) => {
      const row = document.createElement("div");
      row.className = "row" + (r.sp && gi === 0 ? " sp" : "");
      row.dataset.sum = g.reduce((a, x) => a + x.ar, 0);
      row.dataset.n = g.length;
      g.forEach(it => {
        const k = ALL.indexOf(it), [name, cat] = B[it.br];
        const showCap = it.br !== prevBrand; prevBrand = it.br;
        const f = document.createElement("figure");
        f.className = "fig"; f.style.setProperty("--ar", it.ar);
        f.innerHTML = `<div class="fr" style="--c:${it.c}" data-k="${k}" role="button" tabindex="0" aria-label="View ${name}">
            <img alt="${name} packaging" decoding="async" ${k < 3 ? 'fetchpriority="high"' : 'loading="lazy"'}></div>
          <figcaption class="cap lbl">${showCap ? `<b>${name}</b><span>${cat}</span>` : ""}</figcaption>`;
        const img = f.querySelector("img");
        img.dataset.id = it.id;
        img.addEventListener("load", () => img.classList.add("ld"), { once: true });
        row.appendChild(f);
      });
      gal.appendChild(row);
    });
  });
  sizeRows();
  observe();
}

function sizeRows() {
  const W = gal.clientWidth, gap = parseFloat(getComputedStyle(gal.firstChild).columnGap) || 10;
  const capH = innerWidth <= 720 ? innerHeight * 0.75 : Math.min(innerHeight * 0.78, 760);
  gal.querySelectorAll(".row").forEach(row => {
    const n = +row.dataset.n, sum = +row.dataset.sum;
    const h = (W - gap * (n - 1)) / sum;
    const maxH = n === 1 ? (innerWidth <= 720 ? capH : 1e9) : capH;
    row.style.maxWidth = h > maxH ? Math.round(maxH * sum + gap * (n - 1)) + "px" : "";
    const rowW = Math.min(W, h > maxH ? maxH * sum + gap * (n - 1) : W);
    row.querySelectorAll("img").forEach((img, i) => {
      const w = (rowW - gap * (n - 1)) * (+row.children[i].style.getPropertyValue("--ar")) / sum;
      const id = img.dataset.id;
      img.sizes = Math.ceil(w) + "px";
      if (!img.srcset) { img.srcset = `${IMG}${id}-m.webp 900w, ${IMG}${id}.webp 1800w`; img.src = `${IMG}${id}-m.webp`; }
      if (img.complete && img.naturalWidth) img.classList.add("ld");
    });
  });
}

/* ---------- reveal ---------- */
let io;
function observe() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const figs = [...e.target.children];
    figs.forEach((f, i) => setTimeout(() => f.classList.add("on"), i * 90));
    io.unobserve(e.target);
  }), { rootMargin: "0px 0px -6% 0px", threshold: 0.01 });
  gal.querySelectorAll(".row").forEach(r => io.observe(r));
}

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
layout();
requestAnimationFrame(() => setTimeout(() => document.body.classList.add("in"), 60));

/* ---------- scroll: progress + header ---------- */
const pr = document.getElementById("pr"), topBar = document.getElementById("top");
let lastY = scrollY, ticking = false;
addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    pr.style.transform = `scaleX(${max > 0 ? y / max : 0})`;
    if (Math.abs(y - lastY) > 6) { topBar.classList.toggle("hide", y > 200 && y > lastY); lastY = y; }
    ticking = false;
  });
}, { passive: true });

/* ---------- viewer ---------- */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCap"), lbN = document.getElementById("lbN");
let at = 0, lastFocus = null;
function show(i, dir) {
  at = (i + ALL.length) % ALL.length;
  const it = ALL[at], [name, cat] = B[it.br];
  lbImg.classList.add("out");
  const src = IMG + it.id + ".webp";
  const pre = new Image(); pre.src = src;
  const swap = () => { lbImg.src = src; lbImg.alt = name + " packaging"; requestAnimationFrame(() => lbImg.classList.remove("out")); };
  pre.complete ? swap() : (pre.onload = swap, pre.onerror = swap);
  lbCap.innerHTML = `<b>${name}</b> <span class="mut">· ${cat}</span>`;
  lbN.textContent = `${String(at + 1).padStart(2, "0")} / ${ALL.length}`;
  [at + 1, at - 1].forEach(n => { const g = ALL[(n + ALL.length) % ALL.length]; new Image().src = IMG + g.id + ".webp"; });
}
function open(i) { lastFocus = document.activeElement; show(i); lb.classList.add("open"); document.documentElement.style.overflow = "hidden"; document.getElementById("lbX").focus({ preventScroll: true }); }
function close() { lb.classList.remove("open"); document.documentElement.style.overflow = ""; lastFocus && lastFocus.focus({ preventScroll: true }); }
gal.addEventListener("click", e => { const f = e.target.closest(".fr"); if (f) open(+f.dataset.k); });
gal.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("fr")) { e.preventDefault(); open(+e.target.dataset.k); } });
document.getElementById("lbX").onclick = close;
document.getElementById("lbF").onclick = document.getElementById("zr").onclick = () => show(at + 1);
document.getElementById("lbP").onclick = document.getElementById("zl").onclick = () => show(at - 1);
document.getElementById("lbSt").addEventListener("click", e => { if (e.target.id === "lbSt") close(); });
addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") show(at + 1);
  else if (e.key === "ArrowLeft") show(at - 1);
});
let tx = 0, ty = 0;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lb.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(at + (dx < 0 ? 1 : -1));
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
}, { passive: true });
</script>
</body>
</html>
