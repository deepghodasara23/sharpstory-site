# Netlify builds the site from content/ on every change (including edits made in /admin).
[build]
  command = "python3 build.py"
  publish = "dist"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Only inline scripts and the content editor's script may run. This also keeps
    # Netlify's "Powered by Netlify" badge script from loading.
    Content-Security-Policy = "script-src 'unsafe-inline' https://unpkg.com; worker-src 'self' blob:"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
