<style>
:root{--pap:#f1f0eb;--ink:#0c0c0d;--mut:#0c0c0d80;--line:#0c0c0d1a;--b:#1F3BFF;--g:clamp(16px,2.6vw,40px);--gap:clamp(8px,1vw,14px);
  --e:cubic-bezier(.16,1,.3,1);--io:cubic-bezier(.77,0,.18,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
body{background:var(--pap);color:var(--ink);font:400 15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}img,svg{display:block}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--b);color:#fff}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.mut{color:var(--mut)}
@media(hover:hover) and (pointer:fine){html.cc,html.cc *{cursor:none!important}}

/* progress */
.pr{position:fixed;inset:0 0 auto;height:2px;background:var(--b);transform-origin:0 50%;transform:scaleX(0);z-index:95}

/* top bar */
.top{position:fixed;z-index:80;left:0;right:0;top:0;padding:calc(var(--g)*.6 + env(safe-area-inset-top,0px)) var(--g) 14px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(var(--pap) 55%,#f1f0eb00);transition:transform .8s var(--e)}
.top.hide{transform:translateY(-110%)}
.lg{display:flex;align-items:center;gap:12px}
.lg .sym{width:30px;height:30px;transition:transform .9s var(--e)}
.lg:hover .sym{transform:rotate(-90deg)}
.lg .wm{height:11px;width:auto}
@media(max-width:560px){.lg .wm{display:none}}

/* hero */
.hero{padding:calc(110px + 6vh) var(--g) clamp(28px,4vw,56px)}
.hero .ttl{will-change:transform,opacity}
.hero h1{font-weight:800;font-stretch:76%;text-transform:uppercase;line-height:.88;letter-spacing:.004em;font-size:clamp(52px,11.5vw,190px)}
.hero h1 .w{display:block;white-space:nowrap}
.hero h1 .ch{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.03em}
.hero h1 .ch>span{display:inline-block;transform:translateY(105%);transition:transform 1.2s var(--e);transition-delay:calc(var(--i)*28ms)}
.hero h1 .w:nth-child(2){color:var(--b)}
.in .hero h1 .ch>span{transform:none}
.meta{margin-top:clamp(24px,3vw,40px);padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;
  opacity:0;transform:translateY(8px);transition:opacity 1s .6s,transform 1s .6s var(--e)}
.in .meta{opacity:1;transform:none}
.meta .sc i{display:inline-block;animation:bob 2.2s var(--io) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* views */
.view{transition:opacity .45s var(--e),transform .6s var(--e)}
.view.leave{opacity:0;transform:translateY(16px)}
.view[hidden]{display:none}

/* gallery */
.gal{padding:0 var(--g)}
.row{display:flex;gap:var(--gap);margin:0 auto var(--gap);justify-content:center}
.row.sp{margin-top:clamp(36px,6vw,96px)}
.fig{position:relative;flex:var(--ar) 1 0%;min-width:0}
.fr{position:relative;display:block;width:100%;aspect-ratio:var(--ar);overflow:hidden;background:var(--c);border-radius:4px;
  clip-path:inset(100% 0 0 0 round 4px);transition:clip-path 1.25s var(--io),opacity .55s var(--e),filter .55s var(--e)}
.fig.on .fr{clip-path:inset(0 0 0 0 round 4px)}
.fr .px{position:absolute;left:0;right:0;top:-3.5%;bottom:-3.5%;will-change:transform}
.fr img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.14);transition:opacity .7s var(--e),transform 1.6s var(--e)}
.fig.on .fr img.ld{opacity:1;transform:none}
@media(hover:hover){
  .fig.on .fr:hover img.ld{transform:scale(1.035);transition:transform 1.1s var(--e)}
  .row:has(.fr:hover) .fig:not(:has(.fr:hover)) .fr{opacity:.42;filter:grayscale(.7)}
}
.cap{display:flex;gap:10px;align-items:baseline;padding-top:10px;min-height:28px}
.cap>*{opacity:0;transform:translateY(6px);transition:opacity .8s .35s,transform .8s .35s var(--e)}
.fig.on .cap>*{opacity:1;transform:none}
.cap b{font-weight:600}.cap span{color:var(--mut);transition-delay:.45s}
@media(max-width:720px){.cap{flex-direction:column;gap:0;min-height:0;padding-bottom:6px}}

/* index view */
.idx{padding:0 var(--g)}
.idx .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap)}
@media(max-width:1100px){.idx .grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.idx .grid{grid-template-columns:repeat(3,1fr)}}
.it{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--c);opacity:0;transform:translateY(18px) scale(.98)}
.idx.go .it{animation:pop .9s var(--e) forwards;animation-delay:calc(min(var(--i),30)*22ms)}
@keyframes pop{to{opacity:1;transform:none}}
.it img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--e)}
.it.w img{object-fit:contain;padding:8%}
.it figcaption{position:absolute;left:10px;right:10px;bottom:9px;color:#fff;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .5s var(--e);z-index:2}
.it::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#0c0c0d99);opacity:0;transition:opacity .4s}
@media(hover:hover){.it:hover img{transform:scale(1.06)}.it:hover::after,.it:hover figcaption{opacity:1;transform:none}}

/* view switch */
.sw{position:fixed;z-index:85;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);display:flex;padding:4px;border-radius:99px;
  background:#0c0c0de6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--pap);transition:transform .9s var(--e)}
.in .sw{transform:translate(-50%,0)}
.sw button{position:relative;z-index:1;padding:10px 18px;border-radius:99px;transition:color .4s}
.sw button sup{font-size:9px;margin-left:3px;opacity:.6}
.sw button.on{color:var(--ink)}
.sw .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:99px;background:var(--pap);transition:transform .6s var(--e),width .6s var(--e)}

/* footer */
.ft{margin-top:clamp(70px,10vw,150px);padding:clamp(40px,6vw,80px) var(--g) calc(90px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
.ft .sym{width:46px;height:46px;margin-bottom:22px;transition:transform 1.2s var(--e)}
.ft:hover .sym{transform:rotate(-90deg)}
.ft .mail{display:inline-block;font-weight:800;font-stretch:76%;text-transform:uppercase;line-height:.95;font-size:clamp(22px,5vw,72px);white-space:nowrap;position:relative}
.ft .mail::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.06em;background:var(--b);transform:scaleX(0);transform-origin:100% 50%;transition:transform .7s var(--e)}
.ft .mail:hover{color:var(--b)}.ft .mail:hover::after{transform:scaleX(1);transform-origin:0 50%}
.ft .r{text-align:right;display:grid;gap:6px}.ft .r a:hover{color:var(--b)}
@media(max-width:720px){.ft{grid-template-columns:1fr}.ft .r{text-align:left}.ft .mail{font-size:5.6vw}}

/* cursor */
.cur{position:fixed;left:0;top:0;z-index:120;pointer-events:none;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:width .5s var(--e),height .5s var(--e),margin .5s var(--e),background .4s,opacity .3s}
.cur em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .25s}
.cur.big{width:86px;height:86px;margin:-43px 0 0 -43px;background:var(--b)}
.cur.big em{opacity:1;transition-delay:.12s}
.cur.lk{width:34px;height:34px;margin:-17px 0 0 -17px;background:#1F3BFF33}
.cur.off{opacity:0}
@media(hover:none),(pointer:coarse){.cur{display:none}}

/* viewer */
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);visibility:hidden;pointer-events:none;transition:visibility 0s .6s}
.lb::before{content:"";position:absolute;inset:0;background:var(--pap);opacity:0;transition:opacity .55s var(--e)}
.lb.open{visibility:visible;pointer-events:auto;transition:none}
.lb.open::before{opacity:1}
.lb>*{position:relative}
.lb-t,.lb-b{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--g) 14px;opacity:0;transition:opacity .5s .1s}
.lb-b{padding:12px var(--g) calc(16px + env(safe-area-inset-bottom,0px))}
.lb.open .lb-t,.lb.open .lb-b{opacity:1}
.lb-st{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 var(--g);touch-action:pan-y}
.lb-st img{position:absolute;object-fit:contain;border-radius:4px;transition:opacity .3s,transform .55s var(--e)}
.lb-st img.out{opacity:0;transform:translateX(calc(var(--d,1)*-24px))}
.lb-st img.pre{transition:none;transform:translateX(calc(var(--d,1)*24px));opacity:0}
.lb-st img.hid{visibility:hidden}
.fly{position:fixed;z-index:101;object-fit:cover;border-radius:4px;pointer-events:none}
.lb-cap b{font-weight:600}
.btn{border:1px solid var(--line);border-radius:99px;padding:9px 16px;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--ink);color:var(--pap);border-color:var(--ink)}
.nav{display:flex;gap:8px}
.cnt{font-variant-numeric:tabular-nums;min-width:56px}
.zl,.zr{position:absolute;top:0;bottom:0;width:32%}.zr{right:0}.zl{left:0}
.strip{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;height:46px;aspect-ratio:var(--ar);max-width:84px;border-radius:3px;overflow:hidden;background:var(--c);opacity:.45;outline:1.5px solid transparent;outline-offset:2px;transition:opacity .3s,outline-color .3s}
.strip button img{width:100%;height:100%;object-fit:cover}
.strip button:hover{opacity:.8}
.strip button.on{opacity:1;outline-color:var(--b)}
@media(max-width:720px){.lb-b .nav{display:none}.strip button{height:40px}}
@media(hover:none){.zl,.zr{display:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.fr{clip-path:none!important}}
</style>
</head>

function balance(items, W) {
  const T = W * 0.56, n = items.length; let best = null, bestC = 1e9;
  for (let mask = 0; mask < (1 << (n - 1)); mask++) {

    for (let i = 1; i < n; i++) { if (mask & (1 << (i - 1))) { parts.push(cur); cur = []; } cur.push(items[i]); }

  document.addEventListener("mouseleave", () => cur.classList.add("off"));
  document.addEventListener("mouseenter", () => cur.classList.remove("off"));
  (function loop() { cx += (x - cx) * 0.2; cy += (y - cy) * 0.2; cur.style.transform = `translate3d(${cx}px,${cy}px,0)`; requestAnimationFrame(loop); })();
  document.addEventListener("mouseover", e => {
    const t = e.target.closest("[data-c]"), c = t ? t.dataset.c : "";
    cur.classList.toggle("lk", c === "lk");
    cur.classList.toggle("big", !!c && c !== "lk");
    if (c && c !== "lk") curT.textContent = c;
  });
}

/* ---------- viewer ---------- */
const lb = $("lb"), lbImg = $("lbImg"), lbSt = $("lbSt"), strip = $("strip");
strip.innerHTML = ALL.map((it, k) => `<button data-k="${k}" style="--ar:${it.ar};--c:${it.c}" aria-label="${B[it.br][0]} ${k + 1}"><img src="${IMG}${it.id}-m.webp" alt="" loading="lazy"></button>`).join("");
let at = 0, isOpen = false, busy = false;
const fullSrc = k => IMG + ALL[k].id + ".webp";
function fitRect(k) {
  const s = lbSt.getBoundingClientRect(), pad = parseFloat(getComputedStyle(lbSt).paddingLeft);
  const aw = s.width - pad * 2, ah = s.height, ar = ALL[k].ar;
  let w = aw, h = w / ar; if (h > ah) { h = ah; w = h * ar; }
  return { left: s.left + (s.width - w) / 2, top: s.top + (ah - h) / 2, width: w, height: h };
}
function applyFit(k) {
  const r = fitRect(k), s = lbSt.getBoundingClientRect();
  Object.assign(lbImg.style, { left: (r.left - s.left) + "px", top: (r.top - s.top) + "px", width: r.width + "px", height: r.height + "px" });
}
function tileEl(k) { return $(view).querySelector(`[data-k="${k}"]`); }
function setMeta(k) {
  const it = ALL[k], [name, cat] = B[it.br];
  $("lbCap").innerHTML = `<b>${name}</b> <span class="mut">· ${cat}</span>`;
  $("lbN").textContent = `${String(k + 1).padStart(2, "0")} / ${ALL.length}`;
  strip.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.k === k));
  const on = strip.children[k]; strip.scrollTo({ left: on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2, behavior: isOpen ? "smooth" : "instant" });
  [k + 1, k - 1].forEach(n => { new Image().src = fullSrc((n + ALL.length) % ALL.length); });
}
function fly(fromR, toR, src, ms) {
  const f = document.createElement("img"); f.className = "fly"; f.src = src;
  Object.assign(f.style, { left: fromR.left + "px", top: fromR.top + "px", width: fromR.width + "px", height: fromR.height + "px" });
  document.body.appendChild(f);
  const a = f.animate([
    { left: fromR.left + "px", top: fromR.top + "px", width: fromR.width + "px", height: fromR.height + "px" },
    { left: toR.left + "px", top: toR.top + "px", width: toR.width + "px", height: toR.height + "px" }
  ], { duration: ms, easing: "cubic-bezier(.77,0,.18,1)", fill: "forwards" });
  return a.finished.then(() => f);
}
function open(k) {
  if (isOpen || busy) return; busy = true; at = k;
  lenis && lenis.stop(); document.documentElement.style.overflow = "hidden";
  lb.classList.add("open"); setMeta(k);
  const el = tileEl(k), from = el && el.getBoundingClientRect();
  applyFit(k); lbImg.src = fullSrc(k); lbImg.alt = B[ALL[k].br][0] + " packaging"; lbImg.className = "hid";
  const go = () => {
    if (!from || reduce) { lbImg.className = ""; busy = false; isOpen = true; return; }
    el.style.visibility = "hidden";
    const small = el.querySelector("img").currentSrc || fullSrc(k);
    fly(from, fitRect(k), small, 760).then(f => { lbImg.className = ""; el.style.visibility = ""; requestAnimationFrame(() => f.remove()); busy = false; isOpen = true; });
  };
  requestAnimationFrame(go);
  $("lbX").focus({ preventScroll: true });
}
function close() {
  if (!isOpen || busy) return; busy = true;
  let el = tileEl(at);
  const finish = () => { lb.classList.remove("open"); document.documentElement.style.overflow = ""; lenis && lenis.start(); isOpen = false; busy = false; };
  if (!el || reduce) { finish(); return; }
  let r = el.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) {   // bring the tile into view behind the viewer, then land on it
    document.documentElement.style.overflow = "";
    const y = scrollY + r.top - (innerHeight - r.height) / 2;
    lenis ? lenis.scrollTo(y, { immediate: true, force: true }) : scrollTo({ top: y, behavior: "instant" });
    document.documentElement.style.overflow = "hidden";
    r = el.getBoundingClientRect();
  }
  const fromR = lbImg.getBoundingClientRect();
  el.style.visibility = "hidden"; lbImg.className = "hid";
  lb.classList.remove("open");
  fly(fromR, r, lbImg.currentSrc || lbImg.src, 620).then(f => { el.style.visibility = ""; f.remove(); finish(); });
}
let navT = 0;
function show(k, d) {
  if (!isOpen) return;
  at = (k + ALL.length) % ALL.length; setMeta(at);
  lbSt.style.setProperty("--d", d || 1);
  lbImg.className = "out"; clearTimeout(navT);
  const src = fullSrc(at), pre = new Image(); pre.src = src;
  navT = setTimeout(() => {
    const swap = () => { lbImg.className = "pre"; applyFit(at); lbImg.src = src; lbImg.alt = B[ALL[at].br][0] + " packaging"; void lbImg.offsetWidth; lbImg.className = ""; };
    pre.complete ? swap() : (pre.onload = pre.onerror = swap);
  }, 220);
}
document.addEventListener("click", e => {
  const t = e.target.closest(".fr, .it"); if (!t) return;
  e.preventDefault(); open(+t.dataset.k);
});
$("lbX").onclick = close;
$("lbF").onclick = $("zr").onclick = () => show(at + 1, 1);
$("lbP").onclick = $("zl").onclick = () => show(at - 1, -1);
strip.addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(+b.dataset.k, +b.dataset.k > at ? 1 : -1); });
lbSt.addEventListener("click", e => { if (e.target === lbSt) close(); });
addEventListener("keydown", e => {
  if (!isOpen) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") show(at + 1, 1);
  else if (e.key === "ArrowLeft") show(at - 1, -1);
});
let tx = 0, ty = 0;
lbSt.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lbSt.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(at + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
}, { passive: true });

/* ---------- start ---------- */
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { layout(); placeInd(); onScroll(); if (isOpen) applyFit(at); }, 120); });
layout();
document.fonts && document.fonts.ready.then(placeInd); placeInd();
requestAnimationFrame(() => setTimeout(() => { document.body.classList.add("in"); onScroll(); }, 80));
</script>
</body>
