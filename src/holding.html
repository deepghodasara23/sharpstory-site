<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title><meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DESC}}"><meta property="og:type" content="website">
<meta property="og:image" content="{{DOMAIN}}/og.png"><meta property="og:url" content="{{DOMAIN}}/"><meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{DOMAIN}}/"><meta name="theme-color" content="#f1f0eb">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
/* A press proof: the headline is printed in four plates that slide into register. */
:root{--pap:#f1f0eb;--ink:#0c0c0d;--mut:#0c0c0d8c;--line:#0c0c0d1f;--b:#1F3BFF;--c:#00aeef;--m:#ec008c;--y:#ffe600;
  --g:clamp(18px,2.6vw,40px);--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pap);color:var(--ink)}
body{min-height:100svh;font:400 clamp(15px,1.05vw,17px)/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:grid;grid-template-rows:auto 1fr auto;padding:calc(var(--g) + env(safe-area-inset-top,0px)) max(var(--g),env(safe-area-inset-right,0px)) calc(var(--g) + env(safe-area-inset-bottom,0px)) max(var(--g),env(safe-area-inset-left,0px))}
a{color:inherit;text-decoration:none}
::selection{background:var(--b);color:#fff}
:focus-visible{outline:2px solid var(--b);outline-offset:4px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

/* crop marks */
.crop{position:fixed;width:22px;height:22px;pointer-events:none;opacity:.55}
.crop:before,.crop:after{content:"";position:absolute;background:var(--ink)}
.crop:before{width:22px;height:1px}.crop:after{width:1px;height:22px}
.crop.tl{left:8px;top:8px}.crop.tr{right:8px;top:8px;transform:scaleX(-1)}.crop.bl{left:8px;bottom:8px;transform:scaleY(-1)}.crop.br{right:8px;bottom:8px;transform:scale(-1)}

header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-stretch:80%;font-size:17px;letter-spacing:.01em;text-transform:uppercase}
.lg svg{width:30px;height:30px;transition:transform .9s var(--e)}.lg:hover svg{transform:rotate(-90deg)}
.st{display:flex;align-items:center;gap:10px;color:var(--mut)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--b);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #1f3bff66}70%{box-shadow:0 0 0 10px #1f3bff00}100%{box-shadow:0 0 0 0 #1f3bff00}}

main{display:grid;align-content:center;gap:clamp(22px,3.4vh,44px);padding-block:clamp(28px,5vh,70px)}
.proof{display:flex;align-items:center;gap:14px;color:var(--mut)}
.proof svg{width:22px;height:22px;flex:none}

/* the four plates */
.press{position:relative;display:grid;cursor:default;user-select:none}
.press .p{grid-area:1/1;font-weight:800;font-stretch:76%;text-transform:uppercase;line-height:.84;letter-spacing:-.01em;
  font-size:clamp(72px,min(19.5vw,26vh),330px);mix-blend-mode:multiply;will-change:transform}
.press .p.c{color:var(--c)}.press .p.m{color:var(--m)}.press .p.y{color:var(--y)}.press .p.k{color:var(--ink)}
.press .p .dot{color:var(--b)}
.press .p:not(.k) .dot{visibility:hidden}

.copy{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:end}
.copy p{font-size:clamp(18px,1.6vw,24px);line-height:1.4;max-width:30ch}
.copy p+p{margin-top:14px;color:var(--mut)}
.acts{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 26px;border-radius:99px;background:var(--b);color:#fff;font-weight:600;font-size:16px;overflow:hidden;isolation:isolate}
.btn:after{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .55s var(--e);z-index:-1}
.btn:hover:after{transform:none}
.btn span{transition:transform .55s var(--e)}.btn:hover span{transform:translateX(4px)}
.mail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:16px}
.mail a{border-bottom:1.5px solid var(--line);padding-bottom:2px;transition:border-color .3s}
.mail a:hover{border-color:var(--ink)}
.mail button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;cursor:pointer;color:var(--mut);padding:6px 0}
.mail button:hover{color:var(--ink)}

/* slug line: colour bar + job details, like the edge of a press sheet */
footer{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.bar{display:flex;height:14px}
.bar i{width:22px;height:14px}
.slug{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut)}
.soc{display:flex;gap:20px}
.soc a{color:var(--mut);transition:color .3s}.soc a:hover{color:var(--ink)}

/* entrance */
.fu{opacity:0;transform:translateY(18px);animation:fu 1s var(--e) forwards}
@keyframes fu{to{opacity:1;transform:none}}
.d1{animation-delay:.9s}.d2{animation-delay:1.05s}.d3{animation-delay:1.2s}

@media(max-width:760px){
  .copy{grid-template-columns:1fr}
  .st span{display:none}
  .press .p{font-size:clamp(56px,22vw,200px)}
  footer{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){.fu{animation:none;opacity:1;transform:none}.st i{animation:none}}
</style></head>
<body>
<span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
<header>
  <a class="lg" href="/" aria-label="Sharp Story">{{SYM}}<span>Sharp Story</span></a>
  <div class="st lbl"><i></i><span>{{STATUS}}</span></div>
</header>
<main>
  <div class="proof lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 1v22M1 12h22"/></svg>{{LABEL}}</div>
  <h1 class="sr">{{H1_PLAIN}}</h1>
  <div class="press" id="press" aria-hidden="true">
    <div class="p y">{{H1_LINES}}</div><div class="p m">{{H1_LINES}}</div><div class="p c">{{H1_LINES}}</div><div class="p k">{{H1_LINES}}</div>
  </div>
  <div class="copy">
    <div class="fu d1"><p>{{TEXT}}</p><p>{{TEXT2}}</p></div>
    <div class="acts fu d2">
      <a class="btn" href="/book/">{{BUTTON}} <span>→</span></a>
      <div class="mail"><a href="mailto:{{EMAIL}}" id="mail">{{EMAIL}}</a><button type="button" id="copy">Copy</button></div>
    </div>
  </div>
</main>
<footer class="fu d3">
  <div class="bar" aria-hidden="true"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--ink)"></i><i style="background:var(--b)"></i><i style="background:#1f3bffbf"></i><i style="background:#1f3bff80"></i><i style="background:#1f3bff40"></i></div>
  <div class="slug lbl"><span>sharpstory.studio</span><span>{{SLUG}}</span><span>{{DATE}}</span></div>
  <nav class="soc lbl" aria-label="Social">{{SOCIALS}}</nav>
</footer>
<script>
(function(){
var P=[].slice.call(document.querySelectorAll('#press .p'));
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* each plate drifts in its own direction, like a press out of register */
var dir=[[-.35,-1],[.85,-.55],[-1,.45],[0,0]];
var start=[[-10,-16],[18,-10],[-20,9],[0,0]];
var cur=start.map(function(s){return s.slice()}),mag=0,tmag=0,t0=performance.now(),settled=RM;
function set(){P.forEach(function(p,i){p.style.transform='translate('+cur[i][0].toFixed(2)+'px,'+cur[i][1].toFixed(2)+'px)'})}
function ease(x){return 1-Math.pow(1-x,4)}
if(RM){cur=[[0,0],[0,0],[0,0],[0,0]];set();}
else{
  P.forEach(function(p,i){p.style.opacity=i==3?0:1});
  (function tick(now){
    var k=Math.min(1,(now-t0)/1900),e=ease(k);
    P[3].style.opacity=Math.min(1,(now-t0-500)/700);
    mag+=(tmag-mag)*.08;
    for(var i=0;i<3;i++){var s=start[i],d=dir[i];
      cur[i][0]=s[0]*(1-e)+d[0]*mag;cur[i][1]=s[1]*(1-e)+d[1]*mag}
    set();
    if(k<1||Math.abs(tmag-mag)>.02)requestAnimationFrame(tick);else{settled=true;running=false}
  })(t0);
}
var running=true;
function wake(){if(!running){running=true;t0=performance.now()-5000;requestAnimationFrame(function loop(now){mag+=(tmag-mag)*.08;for(var i=0;i<3;i++){cur[i][0]=dir[i][0]*mag;cur[i][1]=dir[i][1]*mag}set();if(Math.abs(tmag-mag)>.02)requestAnimationFrame(loop);else running=false})}}
/* the pointer pulls the plates out of register; leave and they settle */
if(!RM&&matchMedia('(hover:hover)').matches){
  var press=document.getElementById('press');
  addEventListener('pointermove',function(e){var r=press.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var d=Math.hypot(e.clientX-cx,e.clientY-cy)/Math.hypot(r.width,r.height);tmag=Math.max(0,1.1-d*2.2)*12;wake()},{passive:true});
  document.addEventListener('pointerleave',function(){tmag=0;wake()});
}
/* now and then the press slips a little and finds register again */
if(!RM)setInterval(function(){if(document.hidden||tmag>1)return;tmag=6;wake();setTimeout(function(){tmag=0;wake()},420)},7000);
var b=document.getElementById('copy');
b.addEventListener('click',function(){var t=document.getElementById('mail').textContent;
  function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1600)}
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,function(){});});
})();
</script>
</body></html>
